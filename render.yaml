# --- APRESENTAÇÃO: Tirar print daqui até a linha 11 ---
# Explicação: Blueprint de Deploy (IaC). Em vez de configurar o servidor clicando em painéis,
# declaramos toda a infraestrutura em código. O Render lê isso, cria o banco de dados (elevva-db)
# e injeta a "connectionString" de forma segura no backend (linhas 8 a 11) automaticamente.
services:
  - type: web
    name: elevva-apicerto
    runtime: image
    repo: https://github.com/JoaoPedroScalioni/web-c
    dockerfilePath: ./Dockerfile.prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: elevva-db
          property: connectionString
      - key: JWT_SECRET_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "43200"
      - key: STORAGE_BACKEND
        value: r2
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: elevva-midias
      - key: R2_PUBLIC_URL
        sync: false
      - key: TIMEZONE
        value: America/Sao_Paulo
      - key: CORS_ORIGINS
        value: https://web-c-kappa.vercel.app,https://app.elevva.com
      - key: LOG_LEVEL
        value: WARNING
      - key: PUBLIC_API_URL
        value: https://elevva-apicerto.onrender.com

  - type: web
    name: elevva-web
    runtime: image
    repo: https://github.com/JoaoPedroScalioni/web-c
    dockerfilePath: ./frontend/Dockerfile.prod
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://elevva-apicerto.onrender.com
      - key: NODE_ENV
        value: production

databases:
  - name: elevva-db
    databaseName: elevva
    user: elevva_prod_admin
    plan: free
