name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
  DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
  IMAGE_API: ${{ secrets.DOCKER_HUB_USERNAME }}/elevva-api
  IMAGE_WEB: ${{ secrets.DOCKER_HUB_USERNAME }}/elevva-web

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: elevva_su
          POSTGRES_PASSWORD: elevva_secure_password
          POSTGRES_DB: elevva_test
        options: >-
          --health-cmd pg_isready -U elevva_su -d elevva_test
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libpq-dev build-essential

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Create .env for tests
        run: |
          cp .env.example .env
          echo "DATABASE_URL=postgresql+asyncpg://elevva_su:elevva_secure_password@localhost:5432/elevva_test" >> .env
          echo "JWT_SECRET_KEY=test_jwt_secret_key_ci" >> .env
          echo "AWS_ACCESS_KEY_ID=test_aws_key" >> .env
          echo "AWS_SECRET_ACCESS_KEY=test_aws_secret" >> .env

      - name: Run Alembic migrations
        run: alembic upgrade head

      - name: Run backend unit tests
        run: pytest backend/tests/unit -v --asyncio-mode=auto
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://elevva_su:elevva_secure_password@localhost:5432/elevva_test

      - name: Run backend integration tests
        run: pytest backend/tests/integration -v --asyncio-mode=auto
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://elevva_su:elevva_secure_password@localhost:5432/elevva_test

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run frontend tests
        run: npm run test:run

      - name: Run frontend lint
        run: npm run lint

  build-and-push:
    name: Build & Push Docker Images
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Generate image tags
        id: tags
        run: |
          echo "api_tag=${{ env.IMAGE_API }}:latest" >> $GITHUB_OUTPUT
          echo "api_tag_sha=${{ env.IMAGE_API }}:${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "web_tag=${{ env.IMAGE_WEB }}:latest" >> $GITHUB_OUTPUT
          echo "web_tag_sha=${{ env.IMAGE_WEB }}:${{ github.sha }}" >> $GITHUB_OUTPUT

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: |
            ${{ steps.tags.outputs.api_tag }}
            ${{ steps.tags.outputs.api_tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile.prod
          push: true
          tags: |
            ${{ steps.tags.outputs.web_tag }}
            ${{ steps.tags.outputs.web_tag_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
