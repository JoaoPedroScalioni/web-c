schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

context: |
  Tech stack: Python 3.12, FastAPI (Backend), Next.js 14 App Router (Frontend), PostgreSQL.
  Architecture: Clean Architecture (Domain, Application, Infrastructure, Presentation).
  UI Style: Quiet Luxury, Minimalist B2B, components from shadcn/ui only.
  Security: Bcrypt for hashing, JWT for session management.
  Domain: B2B Marketing Content Approval Platform.

rules:
  proposal:
    - Focus on the "Why" and business value (resolving WhatsApp chaos).
    - Mark all breaking changes clearly.
  specs:
    - Every requirement MUST use RFC 2119 keywords (MUST, SHALL, SHOULD).
    - Always include a "Caminho de Erro" for authentication and uploads.
  design:
    - Architecture MUST be strictly decoupled (Clean Arch).
    - Decisions must explain the "Why" (Rationale).
  tasks:
    - Tasks must be broken into TDD steps (Test first, then implementation).