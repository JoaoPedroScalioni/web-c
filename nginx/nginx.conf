worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include mime.types;
    default_type application/octet-stream;
    
    # Ocultar a versão do Nginx e outros headers de servidor
    server_tokens off;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # Otimização de Performance (Gzip/Brotli)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # --- APRESENTAÇÃO: Tirar print daqui até a linha 30 ---
    # Explicação: Padrão API Gateway / Reverse Proxy. O Nginx atua como o "porteiro" do domínio.
    # Ele mapeia portas internas (8000 e 3000) para apelidos (api e web), 
    # escondendo a arquitetura interna de quem acessa o site por fora.
    # O Backend do FastAPI
    upstream api {
        server api:8000;
    }

    # O Frontend do Next.js
    upstream web {
        server web:3000;
    }

    server {
        listen 80;
        server_name _; # Aceita qualquer requisição (Placeholder para o domínio, ex: app.elevva.com)

        # ----------------------------------------------------
        # BLOCO PREPARADO PARA LET'S ENCRYPT (CERTBOT)
        # ----------------------------------------------------
        # location /.well-known/acme-challenge/ {
        #     root /var/www/certbot;
        # }
        
        # Redirecionamento HTTPS forçado (Descomentar após ter os certificados)
        # location / {
        #     return 301 https://$host$request_uri;
        # }

        # Configurações de API (Bypass Next.js diretamente pro FastAPI)
        location /api/ {
            # Reescreve a URL tirando o /api/ para bater no backend limpo (opcional dependendo da sua rota)
            # Neste caso, como seu backend escuta em /posts, o correto seria proxy_pass sem rewrite caso o Nginx escute em /api e o backend em /api. 
            # Mas vamos repassar a requisição original e ajustar no base_url do frontend.
            proxy_pass http://api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Configurações do Frontend (Next.js)
        location / {
            proxy_pass http://web;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Suporte ao WebSocket do Next.js (Hot Reload, se necessário)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # ----------------------------------------------------
    # BLOCO HTTPS (Descomentar após emitir o certificado)
    # ----------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name app.elevva.com;
    # 
    #     ssl_certificate /etc/letsencrypt/live/app.elevva.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/app.elevva.com/privkey.pem;
    #
    #     location /api/ {
    #         proxy_pass http://api/;
    #         ...
    #     }
    #     location / {
    #         proxy_pass http://web;
    #         ...
    #     }
    # }
}
