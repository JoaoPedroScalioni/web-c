<body class="font-body min-h-screen flex flex-col">

<header class="w-full top-0 sticky z-50 bg-neutral-50 dark:bg-neutral-950">

<div class="absolute top-[60%] -right-[5%] w-[30%] h-[30%] bg-surface-container rounded-full blur-[100px] opacity-30"></div>
</div>
<!-- Auth Card -->
<div class="w-full max-w-[440px] z-10">
<div class="text-center mb-10">
<h1 class="font-headline text-3xl font-extrabold tracking-tight text-primary mb-2">Elevva Marketing App</h1>
<p class="text-secondary font-body text-sm">Strategic growth through precision data.</p>
</div>
<!-- Shadcn/ui-inspired Tab Card -->
<div class="bg-surface-container-lowest rounded-xl p-1 shadow-[0_10px_40px_-10px_rgba(26,28,28,0.08)]">

<div class="flex bg-surface-container-low p-1 rounded-lg mb-6">
<button class="flex-1 py-2 text-sm font-medium transition-all rounded-md bg-surface-container-lowest shadow-sm text-primary">Login</button>
<button class="flex-1 py-2 text-sm font-medium transition-all rounded-md text-secondary hover:text-primary">Criar Conta</button>
</div>
<div class="px-6 pb-8 pt-2">
<!-- Tab content: Login -->
<div class="space-y-6" id="login-tab">
<div class="space-y-4">
<div class="space-y-1.5">
<label class="text-[0.6875rem] font-semibold uppercase tracking-widest text-secondary font-label" for="email">Email Address</label>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-surface-container focus:ring-2 focus:ring-primary rounded-md px-4 py-2.5 text-sm transition-all outline-none" id="email" placeholder="name@company.com" type="email"/>
</div>
<div class="space-y-1.5">
<div class="flex justify-between items-center">
<label class="text-[0.6875rem] font-semibold uppercase tracking-widest text-secondary font-label" for="password">Password</label>
<a class="text-[0.6875rem] font-medium text-secondary hover:text-primary transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full bg-surface-container-lowest border-none ring-1 ring-surface-container focus:ring-2 focus:ring-primary rounded-md px-4 py-2.5 text-sm transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<button class="w-full bg-primary text-on-primary py-3 rounded-md font-semibold text-sm transition-all hover:bg-primary-container flex items-center justify-center gap-2" onclick="window.location.href='/dashboard'">
              Sign In
              <span class="material-symbols-outlined text-sm" data-icon="arrow_forward">arrow_forward</span>
</button>
<div class="relative py-4">
<div class="absolute inset-0 flex items-center">
<div class="w-full h-[1px] bg-surface-container"></div>
</div>
<div class="relative flex justify-center text-[0.6875rem] uppercase tracking-widest">
<span class="bg-surface-container-lowest px-3 text-secondary">Corporate Access</span>
</div>
</div>
