version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: elevva-db
    restart: always
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db_init:/docker-entrypoint-initdb.d
    networks:
      - elevva-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: elevva-minio
    ports:
      - "9000:9000"     # API do S3 (onde a API Python vai bater)
      - "9001:9001"     # Painel Visual (Console para você abrir no navegador)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - elevva-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: . 
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      TZ: America/Sao_Paulo
      MINIO_ENDPOINT: ${MINIO_ENDPOINT}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME}
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - elevva-net

  web:
    image: node:20-alpine
    container_name: elevva-web
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: npm run dev
    networks:
      - elevva-net
    depends_on:
      - api

  pgadmin:
    image: dpage/pgadmin4
    container_name: elevva-pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@elevva.com  # Seu login no pgAdmin
      PGADMIN_DEFAULT_PASSWORD: admin123       # Sua senha no pgAdmin
    ports:
      - "5050:80"                              # Acesse http://localhost:5050
    networks:
      - elevva-net
    depends_on:
      - db

networks:
  elevva-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data:
