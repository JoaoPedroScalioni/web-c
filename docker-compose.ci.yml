version: '3.8'

services:
  db-test:
    image: postgres:15-alpine
    container_name: elevva-db-ci
    environment:
      POSTGRES_USER: elevva_su
      POSTGRES_PASSWORD: elevva_secure_password
      POSTGRES_DB: elevva_test
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U elevva_su -d elevva_test" ]
      interval: 5s
      timeout: 5s
      retries: 5

  test-runner:
    build: .
    container_name: elevva-tests
    command: >
      sh -c "alembic upgrade head && pytest backend/tests -v --asyncio-mode=auto"
    environment:
      DATABASE_URL: postgresql+asyncpg://elevva_su:elevva_secure_password@db-test:5432/elevva_test
      TEST_DATABASE_URL: postgresql+asyncpg://elevva_su:elevva_secure_password@db-test:5432/elevva_test
      JWT_SECRET_KEY: test_secret_key
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: "1440"
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      S3_BUCKET_NAME: test-bucket
      TIMEZONE: America/Sao_Paulo
    depends_on:
      db-test:
        condition: service_healthy
